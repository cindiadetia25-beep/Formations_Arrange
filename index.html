<!DOCTYPE html>
<html lang="id">
<head>
  <!-- ====================================================================== -->
  <!-- BAGIAN 1: META DATA, JUDUL & LIBRARY EKSTERNAL (KONVA & THREE.JS)      -->
  <!-- ====================================================================== -->
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Paskibra Formation Designer</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#1e293b">
  <link rel="stylesheet" href="style.css?v=14">
  <script src="https://unpkg.com/konva@9.3.6/konva.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

  <!-- ====================================================================== -->
  <!-- BAGIAN 2: HEADER UTAMA & KONTROL DATABASE (SIMPAN / MUAT / HAPUS)      -->
  <!-- ====================================================================== -->
  <header class="toolbar">
    <div class="brand">PASKIBRA<span>ARRANGE</span></div>
    <div class="actions">
      <input type="text" id="formationName" placeholder="Nama Formasi" />
      <button id="btnSave" class="btn primary">Simpan</button>
      <select id="savedList">
        <option value="">-- Muat --</option>
      </select>
      <button id="btnDeleteProject" class="btn danger small" title="Hapus Project Tersimpan">🗑️</button>
    </div>
  </header>

  <!-- ====================================================================== -->
  <!-- BAGIAN 3: SUB-TOOLBAR (UKURAN LAPANG, BENTUK TITIK, 3D & UNDO/REDO)    -->
  <!-- ====================================================================== -->
  <section class="sub-toolbar">
    <div class="field-size-group">
      <span>Lapang:</span>
      <input type="number" id="fieldLength" value="22" min="5" max="100" title="Panjang (m)">
      <span>x</span>
      <input type="number" id="fieldWidth" value="15" min="5" max="100" title="Lebar (m)">
      <button id="btnApplyField" class="btn secondary small">Set</button>
    </div>
    <div class="history-group">
      <button id="btnToggleShape" class="btn secondary small" title="Ubah Bentuk Titik">👤 Orang</button>
      <button id="btnToggle3D" class="btn indigo small" title="Tampilan 3D">🧊 3D</button>
      <button id="btnUndo" class="btn secondary small" disabled>↩</button>
      <button id="btnRedo" class="btn secondary small" disabled>↪</button>
    </div>
  </section>

  <!-- ====================================================================== -->
  <!-- BAGIAN 4: AREA KERJA KANVAS LANDSCAPE (2D, KOTAK DANTON, 3D & KONSOLE) -->
  <!-- ====================================================================== -->
  <main class="workspace">
    <div class="field-info">
      <span id="fieldLabel">ARAH DEWAN JURI / DP — KANAN (22m x 15m)</span>
    </div>

    <!-- Konsol Kamera & Arah Hadap Pasukan (Muncul Saat Mode 3D Aktif) -->
    <div id="cameraConsole3D" class="camera-console hidden">
      <div class="console-row">
        <span class="console-tag">Kamera:</span>
        <button class="cam-btn active" data-view="lomba" title="Kamera Tribun Lomba">Lomba</button>
        <button class="cam-btn" data-view="juri" title="Sudut Dewan Juri">DP/Juri</button>
        <button class="cam-btn" data-view="belakang" title="Sudut Belakang">Belakang</button>
        <button class="cam-btn" data-view="danton" title="Sudut Sisi Danton">Sisi D</button>
        <button class="cam-btn" data-view="atas" title="Tampak Atas">Atas</button>
        <button id="btnCamZoomIn" class="cam-btn" title="Perbesar">+</button>
        <button id="btnCamZoomOut" class="cam-btn" title="Perkecil">−</button>
      </div>
      <div class="console-row">
        <span class="console-tag">Hadap Titik:</span>
        <button class="face-btn" data-face="danton" title="Hadap ke Danton">Ke D</button>
        <button class="face-btn" data-face="dp" title="Hadap Dewan Juri">Ke DP</button>
        <button class="face-btn" data-face="belakang" title="Hadap Belakang">Blkg</button>
        <button class="face-btn" data-face="kiri" title="Hadap Kiri">Kiri</button>
        <button class="face-btn" data-face="kanan" title="Hadap Kanan">Kanan</button>
        <button id="btnFaceRotate" class="face-btn" title="Putar 45 Derajat">↻ 45°</button>
      </div>
    </div>

    <!-- Wadah Lapangan 2D Landscape dengan Kotak Danton Utuh di Bawah Tengah -->
    <div id="fieldWrapper2D" class="field-wrapper">
      <div id="canvas-container"></div>
      <div id="dantonBox2D" class="danton-zone" title="Kotak Khusus Danton">D</div>
    </div>

    <!-- Wadah Simulasi 3D Landscape -->
    <div id="canvas-3d-container" class="hidden"></div>

    <!-- Alat Cepat Pasukan & Mode Blok Seleksi -->
    <div class="quick-tools">
      <button id="btnSelectBox" class="btn secondary small" title="Seret Kotak untuk Blok Banyak Titik">⬚ Blok</button>
      <button id="btnAddMember" class="btn secondary small">+ Pasukan</button>
      <button id="btnRenameMember" class="btn secondary small" disabled>✎ Nama</button>
      <button id="btnDeleteSelected" class="btn warning small" disabled>Hapus</button>
      <button id="btnClearAll" class="btn danger small">Kosongkan</button>
      <button id="btnResetPos" class="btn secondary small">Reset</button>
    </div>
  </main>

  <!-- ====================================================================== -->
  <!-- BAGIAN 5: PANEL TIMELINE HITUNGAN, AUDIO & EXPORT VIDEO                -->
  <!-- ====================================================================== -->
  <footer class="timeline-panel">
    <div class="playback-controls">
      <button id="btnPlay" class="btn play small">▶ Play</button>
      <button id="btnAddScene" class="btn add small">+ Hitungan</button>
      <button id="btnAudio" class="btn purple small">🎵 Audio</button>
      <button id="btnExportVideo" class="btn teal small">⬇ Video</button>
      <input type="file" id="audioInput" accept="audio/*" class="hidden">
      <span id="statusText" class="status">Siap</span>
    </div>
    <div id="audioBadge" class="audio-badge hidden">
      <span id="audioFileName">Lagu terpilih</span>
      <button id="btnRemoveAudio" class="btn-remove-audio">✕</button>
    </div>
    <div id="sceneList" class="scene-list"></div>
  </footer>

  <!-- ====================================================================== -->
  <!-- BAGIAN 6: CUSTOM POP-UP MODAL (NOTIFIKASI, KONFIRMASI & INPUT NAMA)    -->
  <!-- ====================================================================== -->
  <div id="customModal" class="modal-overlay hidden">
    <div class="modal-box">
      <h3 id="modalTitle">Informasi</h3>
      <p id="modalMessage">Pesan notifikasi</p>
      <input type="text" id="modalInput" class="modal-input hidden" placeholder="Ketik nama..." maxlength="12" />
      <div class="modal-buttons">
        <button id="modalCancel" class="btn secondary hidden">Batal</button>
        <button id="modalConfirm" class="btn primary">OK</button>
      </div>
    </div>
  </div>

  <!-- ====================================================================== -->
  <!-- BAGIAN 7: SCRIPT UTAMA & REGISTRASI SERVICE WORKER                     -->
  <!-- ====================================================================== -->
  <script src="app.js?v=14"></script>
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('./sw.js');
    }
  </script>
</body>
</html>
